name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ytresearch?schema=public
  AUTH_SECRET: ci-auth-secret-abcdefghijklmnopqrstuvwxyz
  AUTH_GOOGLE_ID: ci-google-oauth-client-id
  AUTH_GOOGLE_SECRET: ci-google-oauth-client-secret
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Validate, Test, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Run tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
